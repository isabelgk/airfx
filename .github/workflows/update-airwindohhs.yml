name: Update Airwindohhs

on:
  workflow_dispatch:
    inputs:
      plugin:
        description: "Import only this exact plugin slug (optional, for testing one)"
        required: false
      max_plugins:
        description: "Max number of new plugins to import this run (0 = unlimited)"
        default: "5"
  schedule:
    - cron: "0 14 * * *"

permissions:
  contents: write
  pull-requests: write

jobs:
  detect:
    runs-on: macos-14
    outputs:
      plugins: ${{ steps.list.outputs.plugins }}
      latest_sha: ${{ steps.latest.outputs.sha }}
      current_sha: ${{ steps.latest.outputs.current_sha }}
    steps:
      - uses: actions/checkout@v4

      - id: latest
        run: |
          sha=$(git ls-remote https://github.com/isabelgk/airwindohhs.git main | cut -f1)
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          current=$(python3 -c "import re; print(re.search(r'FetchContent_Declare\(\s*airwindohhs.*?GIT_TAG ([0-9a-f]{40})', open('CMakeLists.txt').read(), re.DOTALL).group(1))")
          echo "current_sha=$current" >> "$GITHUB_OUTPUT"

      - id: list
        run: |
          if [ -n "${{ inputs.plugin }}" ]; then
            echo "plugins=$(jq -cn --arg p "${{ inputs.plugin }}" '[$p]')" >> "$GITHUB_OUTPUT"
          else
            current=$(find source/objects -mindepth 2 -maxdepth 2 -type d -name 'airfx.*_tilde' \
              | sed -E 's#.*/airfx\.(.+)_tilde$#\1#' | sort -u)

            python3 - "${{ steps.latest.outputs.sha }}" <<'EOF'
          import re, sys
          sha = sys.argv[1]
          path = "CMakeLists.txt"
          text = open(path).read()
          text = re.sub(
          r"(FetchContent_Declare\(\s*airwindohhs.*?GIT_TAG )[0-9a-f]{40}",
          lambda m: m.group(1) + sha,
          text,
          flags=re.DOTALL,
          )
          open(path, "w").write(text)
          EOF

          cmake -S . -B /tmp/detect-build
          cmake --build /tmp/detect-build --target dump_meta
          all=$(/tmp/detect-build/_deps/airwindohhs-build/dump_meta | python3 -c "import json,sys; [print(p['slug']) for p in json.load(sys.stdin)]" | sort -u)
          missing=$(comm -23 <(echo "$all") <(echo "$current"))

          max="${{ inputs.max_plugins }}"
          max="${max:-5}"
          if [ "$max" != "0" ]; then
            missing=$(echo "$missing" | head -n "$max")
          fi
          echo "plugins=$(echo "$missing" | python3 -c "import json,sys; print(json.dumps([l for l in sys.stdin.read().splitlines() if l]))")" >> "$GITHUB_OUTPUT"

          # Revert the pin bump here -- each matrix job below re-applies it on its
          # own fresh checkout so every per-plugin PR carries its own bump.
          git checkout -- CMakeLists.txt
          fi

  import:
    needs: detect
    if: needs.detect.outputs.plugins != '[]'
    runs-on: macos-14
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        plugin: ${{ fromJson(needs.detect.outputs.plugins) }}
    steps:
      - uses: actions/checkout@v4

      - id: meta
        run: echo "branch=airwindohhs-import/${{ matrix.plugin }}" >> "$GITHUB_OUTPUT"

      - id: existing
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          count=$(gh pr list --head "${{ steps.meta.outputs.branch }}" --state open --json number --jq 'length')
          echo "skip=$([ "$count" -gt 0 ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

      - if: steps.existing.outputs.skip == 'false'
        run: |
          python3 - "${{ needs.detect.outputs.latest_sha }}" <<'EOF'
          import re, sys
          sha = sys.argv[1]
          path = "CMakeLists.txt"
          text = open(path).read()
          text = re.sub(
              r"(FetchContent_Declare\(\s*airwindohhs.*?GIT_TAG )[0-9a-f]{40}",
              lambda m: m.group(1) + sha,
              text,
              flags=re.DOTALL,
          )
          open(path, "w").write(text)
          EOF

      - if: steps.existing.outputs.skip == 'false'
        run: cmake -S . -B build

      - if: steps.existing.outputs.skip == 'false'
        run: python3 scripts/generate_objects.py --only "${{ matrix.plugin }}"

      - if: steps.existing.outputs.skip == 'false'
        id: verify
        run: |
          cmake -S . -B build
          cmake --build build --target "airfx.${{ matrix.plugin }}_tilde"

      - if: steps.existing.outputs.skip == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -b "${{ steps.meta.outputs.branch }}"
          # -A over source/objects and docs also picks up objects the generator
          # moved because their category changed upstream at the new pin.
          git add -A CMakeLists.txt objects.cmake init/objectmappings.txt source/objects docs
          git commit -m "Add airfx.${{ matrix.plugin }}~"
          git push -u origin "${{ steps.meta.outputs.branch }}"
          gh pr create --title "Add airfx.${{ matrix.plugin }}~" \
            --body "Auto-generated by the Update Airwindohhs workflow. Also bumps the airwindohhs FetchContent pin in CMakeLists.txt to the upstream commit this was generated from, if it moved, and moves any existing objects whose category changed upstream." \
            --base main --head "${{ steps.meta.outputs.branch }}"

  # Keeps the pin tracking upstream when there is nothing new to import, which
  # is also how category changes to existing objects land on their own.
  sync:
    needs: detect
    if: needs.detect.outputs.plugins == '[]' && needs.detect.outputs.current_sha != needs.detect.outputs.latest_sha
    runs-on: macos-14
    env:
      BRANCH: airwindohhs-sync
    steps:
      - uses: actions/checkout@v4

      - run: |
          python3 - "${{ needs.detect.outputs.latest_sha }}" <<'EOF'
          import re, sys
          sha = sys.argv[1]
          path = "CMakeLists.txt"
          text = open(path).read()
          text = re.sub(
              r"(FetchContent_Declare\(\s*airwindohhs.*?GIT_TAG )[0-9a-f]{40}",
              lambda m: m.group(1) + sha,
              text,
              flags=re.DOTALL,
          )
          open(path, "w").write(text)
          EOF

      - run: cmake -S . -B build

      - id: generate
        run: |
          python3 scripts/generate_objects.py | tee generate.log
          {
            echo "moved<<EOF"
            grep '^moved ' generate.log | sed 's/^/- /' || true
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - run: |
          cmake -S . -B build
          cmake --build build --parallel

      - env:
          GH_TOKEN: ${{ github.token }}
          MOVED: ${{ steps.generate.outputs.moved }}
        run: |
          short=$(echo "${{ needs.detect.outputs.latest_sha }}" | cut -c1-10)
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git add -A CMakeLists.txt objects.cmake init/objectmappings.txt source/objects docs
          git commit -m "Update airwindohhs to $short"
          # Force so one open PR always tracks the latest upstream commit.
          git push -f -u origin "$BRANCH"

          body="Auto-generated by the Update Airwindohhs workflow. Bumps the airwindohhs FetchContent pin to isabelgk/airwindohhs@${{ needs.detect.outputs.latest_sha }}; every object builds at the new pin."
          if [ -n "$MOVED" ]; then
            body="$body"$'\n\nRecategorized upstream:\n'"$MOVED"
          fi

          if [ "$(gh pr list --head "$BRANCH" --state open --json number --jq 'length')" -gt 0 ]; then
            gh pr edit "$BRANCH" --title "Update airwindohhs to $short" --body "$body"
          else
            gh pr create --title "Update airwindohhs to $short" --body "$body" --base main --head "$BRANCH"
          fi
