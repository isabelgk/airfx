name: Build

on:
  push:
    tags: ["v*"]
  workflow_call:
    inputs:
      target:
        description: Which OS(es) to build
        type: string
        default: all
      release:
        description: Bump the minor version and publish a release
        type: boolean
        default: true
  workflow_dispatch:
    inputs:
      target:
        description: Which OS(es) to build
        type: choice
        default: all
        options:
          - all
          - macos
          - windows
      release:
        description: Bump the minor version and publish a release
        type: boolean
        default: true

# Two merges landing close together would otherwise read the same latest tag
# and mint the same next version.
concurrency:
  group: airfx-release
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      include: ${{ steps.set.outputs.include }}
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      release: ${{ steps.version.outputs.release }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - id: set
        run: |
          case "${{ inputs.target || 'all' }}" in
            macos)
              echo 'include=[{"os":"macos-14","name":"macos"}]' >> "$GITHUB_OUTPUT"
              ;;
            windows)
              echo 'include=[{"os":"windows-2022","name":"windows"}]' >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo 'include=[{"os":"macos-14","name":"macos"},{"os":"windows-2022","name":"windows"}]' >> "$GITHUB_OUTPUT"
              ;;
          esac

      - id: version
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            # Hand-pushed tag: ship exactly what it names, do not bump.
            tag="${{ github.ref_name }}"
          else
            latest=$(git tag --list 'v*' --sort=-v:refname | head -n1)
            latest="${latest:-v0.0.0}"
            core="${latest#v}"
            core="${core%%-*}"
            IFS='.' read -r major minor _ <<< "$core"
            tag="v${major}.$((minor + 1)).0"
          fi

          # A single-OS build cannot produce the combined package a release ships.
          release=true
          if [ "${{ inputs.release }}" = "false" ] || [ "${{ inputs.target || 'all' }}" != "all" ]; then
            release=false
          fi

          {
            echo "tag=$tag"
            echo "version=${tag#v}"
            echo "release=$release"
          } >> "$GITHUB_OUTPUT"

  build:
    needs: plan
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.include) }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        shell: bash
        run: |
          if [ "${{ runner.os }}" = "macOS" ]; then
            cmake -S . -B build -G Ninja -DPACKAGE_VERSION="${{ needs.plan.outputs.version }}"
          else
            cmake -S . -B build -DPACKAGE_VERSION="${{ needs.plan.outputs.version }}"
          fi

      - name: Build
        run: cmake --build build --config Release --parallel

      - uses: actions/upload-artifact@v4
        with:
          name: airfx-${{ matrix.name }}
          path: build/package
          if-no-files-found: error

  bundle:
    name: Bundle combined package
    needs: [plan, build]
    if: ${{ (inputs.target || 'all') == 'all' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download macOS package
        uses: actions/download-artifact@v4
        with:
          name: airfx-macos
          path: package

      - name: Download Windows package
        uses: actions/download-artifact@v4
        with:
          name: airfx-windows
          path: package-windows

      - name: Merge Windows externals into combined package
        run: |
          shopt -s nullglob
          files=(package-windows/externals/*.mxe64)
          if [ ${#files[@]} -eq 0 ]; then
            echo "::error::No .mxe64 externals found in the Windows build output" >&2
            exit 1
          fi
          cp -v "${files[@]}" package/externals/

      - name: Zip combined package
        run: (cd package && zip -qr ../package.zip .)

      - name: Upload combined package
        uses: actions/upload-artifact@v4
        with:
          name: package
          path: package.zip
          if-no-files-found: error

      # Creates the tag as well, pointing at the commit that was actually
      # built -- main may have moved on during the build.
      - name: Tag and release
        if: needs.plan.outputs.release == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.plan.outputs.tag }}
          target_commitish: ${{ github.sha }}
          files: package.zip
          generate_release_notes: true
