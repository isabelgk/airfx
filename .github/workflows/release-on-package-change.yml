name: Release on Package Change

# Import PRs bump the airwindohhs pin only when upstream moved, so matching on
# the pin would miss a new external landing under an unchanged pin. Match on the
# content that ships instead. CMakeLists.txt is deliberately excluded so build
# changes -- including a pin-only bump -- need a manual Build dispatch.
on:
  push:
    branches: [main]
    paths:
      - objects.cmake
      - init/objectmappings.txt
      - source/**
      - docs/**

permissions:
  contents: write

jobs:
  # The version bump lives in build.yml so the tag is minted only once the
  # package it ships has actually built.
  release:
    if: ${{ !contains(github.event.head_commit.message, '[no release]') }}
    uses: ./.github/workflows/build.yml
    with:
      target: all
      release: true
    permissions:
      contents: write
